<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fila visual | Fila Única</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.lane{display:grid;gap:10px}.slot{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:#0d0d0d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px}.slot.me{border-color:var(--gold);background:rgba(245,166,35,.08)}.pos{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ffc107);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center}.slot:not(.me) .pos{background:#2a2a2a;color:var(--muted)}.dots{display:flex;gap:5px}.dot{width:18px;height:18px;border-radius:50%;background:#2a2a2a}.dot.on{background:var(--gold)}.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:8px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.1);background:#111;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600}.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.1)}</style>
</head><body>
<header><div class="header-inner"><a href="index.html" class="logo"><div class="logo-icon">◆</div>Fila Única</a><a href="dashboard.html" class="btn btn-outline">Voltar</a></div></header>
<div class="wrap"><h1>Fila única</h1><p class="muted" style="margin:8px 0 18px;">Visualização demonstrativa da ordem da fila.</p><div class="levels" id="chips"></div><div class="kpis"><div class="kpi"><span>Nível</span><strong id="lvlName">Bronze</strong></div><div class="kpi"><span>Na fila</span><strong id="qtd">0</strong></div><div class="kpi"><span>Sua posição</span><strong id="minha">—</strong></div><div class="kpi"><span>Seu 4/4</span><strong id="ciclo">1/4</strong></div></div><div class="card"><h2 style="color:var(--gold);margin-bottom:14px;">Ordem da fila</h2><div class="lane" id="lane"></div></div></div>
<script>
const NAMES=['bronze','prata','ouro','platina','safira','esmeralda','rubi','diamante'];const LABEL={bronze:'Bronze',prata:'Prata',ouro:'Ouro',platina:'Platina',safira:'Safira',esmeralda:'Esmeralda',rubi:'Rubi',diamante:'Diamante'};const user=JSON.parse(localStorage.getItem('fila_user')||'null');let nivel=(user&&user.nivel)||'bronze';const filled=Number(localStorage.getItem('fila_cycle')||1);function fakeQueue(me){const pool=['ana','bruno','carla','diego','elisa','fabio','gina'];const list=pool.map((x,i)=>({login:x+(i+1),ciclo:((i+2)%4)+1,me:false}));if(me)list.splice(2,0,{login:me.login,ciclo:filled,me:true});return list}function render(){document.getElementById('chips').innerHTML=NAMES.map(n=>`<button class="chip ${n===nivel?'on':''}" data-n="${n}" type="button">${LABEL[n]}</button>`).join('');const q=fakeQueue(user),mi=q.findIndex(x=>x.me);document.getElementById('lvlName').textContent=LABEL[nivel];document.getElementById('qtd').textContent=q.length;document.getElementById('minha').textContent=mi>=0?'#'+(mi+1):'—';document.getElementById('ciclo').textContent=filled+'/4';document.getElementById('lane').innerHTML=q.map((p,i)=>{const d=[1,2,3,4].map(x=>`<span class="dot ${x<=p.ciclo?'on':''}"></span>`).join('');return `<div class="slot ${p.me?'me':''}"><div class="pos">${i+1}</div><div><strong>${p.me?p.login+' (você)':p.login}</strong><div class="muted" style="font-size:.8rem">ciclo ${p.ciclo}/4</div></div><div class="dots">${d}</div></div>`}).join('')}document.getElementById('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){nivel=b.dataset.n;render()}};render();
</script></body></html>
