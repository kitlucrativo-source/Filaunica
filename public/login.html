<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Fila Única</title>
  <style>
    :root {
      --gold: #f5a623;
      --black: #0a0a0a;
      --gray: #1a1a1a;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --danger: #ff6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(245, 166, 35, 0.16), transparent),
        var(--black);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(245, 166, 35, 0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--gold), #ffd700);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #ffc107);
      color: #111;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.35);
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 72px 24px 80px;
    }

    .card {
      background: var(--gray);
      border: 1px solid rgba(245, 166, 35, 0.18);
      border-radius: 20px;
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #ffd700);
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .field input:focus { border-color: var(--gold); }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 22px;
      font-size: 0.85rem;
    }

    .row a { color: var(--gold); }

    .alert {
      display: none;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.35);
      color: #ffb3b3;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .alert.show { display: block; }

    .ok {
      display: none;
      background: rgba(245, 166, 35, 0.12);
      border: 1px solid rgba(245, 166, 35, 0.35);
      color: var(--gold);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .ok.show { display: block; }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .signup a { color: var(--gold); font-weight: 600; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding-bottom: 32px;
    }

    footer a { color: var(--gold); }
  </style>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="service-banner">Cadastros disponíveis · Pagamentos ainda não habilitados</div>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">◆</div>
        Fila Única
      </a>
      <div style="display:flex; gap:10px;">
        <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
        <a href="cadastro.html" class="btn btn-outline">Cadastrar</a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>Entrar</h1>
      <p class="sub">Acesse sua conta para ver a fila e o dashboard.</p>

      <div class="alert" id="alert"></div>
      <div class="ok" id="ok"></div>

      <form method="post" action="#" id="loginForm">
        <div class="field">
          <label for="login">Login ou e-mail</label>
          <input id="login" name="login" type="text" autocomplete="username" placeholder="seuusuario" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="sua senha" required>
        </div>
        <div class="row">
          <span></span>
          <a href="recuperar.html">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn btn-primary">Fazer login</button>
      </form>

      <p class="signup">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>

  <footer>
    <p><a href="index.html">Voltar ao início</a> · <a href="dashboard.html">Dashboard</a></p>
  </footer>

  
</body>
</html>
