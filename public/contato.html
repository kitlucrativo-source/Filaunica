<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contato | Fila Única</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header><div class="header-inner"><a href="index.html" class="logo"><div class="logo-icon">◆</div>Fila Única</a><a href="index.html" class="btn btn-outline">Início</a></div></header><div class="wrap" style="max-width:560px"><h1>Suporte</h1><p class="muted" style="margin:8px 0 24px">Abre o WhatsApp com a mensagem pronta.</p><div class="card gold-bar"><form id="form"><div class="field"><label>Seu nome</label><input id="nome" required></div><div class="field"><label>Login (se tiver)</label><input id="login"></div><div class="field"><label>Assunto</label><select id="assunto"><option>Cadastro</option><option>Pagamento</option><option>Saque</option><option>Senha</option><option>Outro</option></select></div><div class="field"><label>Mensagem</label><input id="msg" required></div><button class="btn btn-primary" style="width:100%" type="submit">Abrir WhatsApp</button></form></div></div><script>const WHATS='5519999609789';document.getElementById('form').onsubmit=e=>{e.preventDefault();const texto=`Olá, sou ${document.getElementById('nome').value} (${document.getElementById('login').value||'sem login'}). Assunto: ${document.getElementById('assunto').value}. ${document.getElementById('msg').value}`;location.href='https://wa.me/'+WHATS+'?text='+encodeURIComponent(texto)};</script></body></html>
