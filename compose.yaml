services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Defina APP_URL como a URL HTTPS publica}
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - fila_data:/app/data
volumes:
  fila_data:
